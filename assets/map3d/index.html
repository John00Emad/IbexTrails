<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>IbexTrails 3D map</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
  html, body, #map {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #E8D5B5;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans",
      "Noto Sans Arabic", sans-serif;
  }
  .ibx-round {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 3px rgba(0, 0, 0, .26);
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .ibx-round svg { width: 16px; height: 16px; fill: #fff; }
  .ibx-turn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #1B2330;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
  }
  .ibx-turn svg { width: 16px; height: 16px; }
  .ibx-pin {
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
  }
  .ibx-pin-label {
    max-width: 120px;
    padding: 1px 7px;
    border-radius: 8px;
    background: #1B2330;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 0 2px rgba(0, 0, 0, .26);
  }
  .ibx-pin svg { width: 20px; height: 20px; }
  .ibx-person {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }
  .ibx-person-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    box-shadow: 0 0 3px rgba(0, 0, 0, .38);
  }
  .ibx-person.selected .ibx-person-dot { border: 3px solid #FFFF00; }
  .ibx-person-name {
    margin-top: 2px;
    max-width: 104px;
    padding: 1px 5px;
    border-radius: 6px;
    background: rgba(255, 255, 255, .9);
    color: #1B2330;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ibx-me {
    width: 40px;
    height: 40px;
    position: relative;
    pointer-events: none;
  }
  .ibx-me svg {
    position: absolute;
    inset: 0;
    width: 40px;
    height: 40px;
    fill: #1C6DD0;
  }
  .ibx-me-dot {
    position: absolute;
    left: 10px;
    top: 10px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: #1C6DD0;
    box-sizing: border-box;
    box-shadow: 0 0 4px rgba(0, 0, 0, .38);
  }
</style>
</head>
<body>
<div id="map"></div>
<script src="vendor/maplibre-contour.min.js"></script>
<script type="module" src="bridge.js"></script>
</body>
</html>
